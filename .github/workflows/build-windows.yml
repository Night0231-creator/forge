name: Astronyx Mini Forge Studio 2.2.10 Windows (Win10/Win11)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar Release (somente quando repositorio publico)'
        type: boolean
        default: false
  push:
    branches: [main, master, v2.2-ui, 'fix/win10-win11-4551', 'fix/v2.2.2-scale-quality', 'feat/v2.2.3-hud-polish', 'fix/v2.2.4-safe-updater', 'fix/v2.2.10-taleweavercmd-diagnostics']
    tags: ['v*']

# A new commit cancels obsolete PR builds; main/tag releases use their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias do visualizador de texturas
        run: python -m pip install pillow numpy
      - name: Testar motor preservado
        run: python -m unittest discover -s tests -v
      - name: Instalar Inno Setup 6
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Compilar Studio.exe e Setup.exe
        shell: powershell
        run: .\tools\build_windows.ps1
      - name: Testar instalador em Windows
        shell: powershell
        run: .\tools\test_installer_windows.ps1
      - name: Compilar pacote portatil one-dir
        shell: powershell
        run: .\tools\build_portable_windows.ps1
      - name: Testar ZIP portatil extraido
        shell: powershell
        run: .\tools\test_portable_windows.ps1
      - name: Gerar hashes SHA256
        shell: powershell
        run: |
          $files = @('dist/installer/AstronyxMiniForgeStudio-Setup-v2.2.10.exe', 'dist/AstronyxMiniForgeStudio-Portable-v2.2.10-Win10-Win11-x64.zip')
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Add-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          }
      - name: Enviar autotestes e hashes
        uses: actions/upload-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Validacao
          path: |
            dist/validation-installed-onedir.json
            dist/validation-installer.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Enviar ZIP portatil Windows 10 e 11
        uses: actions/upload-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Windows-Portable-ZIP
          path: dist/AstronyxMiniForgeStudio-Portable-v2.2.10-Win10-Win11-x64.zip
          if-no-files-found: error
      - name: Enviar instalador
        uses: actions/upload-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Windows-Setup
          path: dist/installer/AstronyxMiniForgeStudio-Setup-v2.2.10.exe
          if-no-files-found: error

  compatibility:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias de pre-visualizacao
        run: python -m pip install pillow numpy
      - name: Testes de compatibilidade em runtime Windows anterior
        run: python -m unittest discover -s tests -v
      - name: Validar inicio sem desktop grafico
        run: python studio.py --version

  release:
    needs: [windows, compatibility]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          actual="$(python -c 'from core.version import APP_VERSION; print(APP_VERSION)')"
          echo "version=${actual}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${actual}" ]]; then exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Windows-Setup
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Windows-Portable-ZIP
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Validacao
          path: release
      - name: Conferir hash do instalador
        shell: bash
        run: |
          test -s "release/AstronyxMiniForgeStudio-Setup-v${{ steps.version.outputs.version }}.exe"
          (cd release && sed -E 's|dist/installer/|./|; s|dist/|./|' SHA256SUMS.txt | sha256sum -c -)
      - id: release_status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v${{ steps.version.outputs.version }}"
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.release_status.outputs.already != 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/AstronyxMiniForgeStudio-Setup-v${{ steps.version.outputs.version }}.exe
            release/AstronyxMiniForgeStudio-Portable-v${{ steps.version.outputs.version }}-Win10-Win11-x64.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
