name: Astronyx Mini Forge Studio 2.0.2 Windows
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar Release (somente quando repositorio publico)'
        type: boolean
        default: false
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar motor preservado
        run: python -m unittest discover -s tests -v
      - name: Instalar Inno Setup 6
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Compilar Studio.exe e Setup.exe
        shell: powershell
        run: .\tools\build_windows.ps1
      - name: Testar instalador em Windows
        shell: powershell
        run: .\tools\test_installer_windows.ps1
      - name: Gerar hashes SHA256
        shell: powershell
        run: |
          $files = @('dist/AstronyxMiniForgeStudio.exe', 'dist/installer/AstronyxMiniForgeStudio-Setup-v2.0.2.exe')
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Add-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          }
      - name: Enviar autotestes e hashes
        uses: actions/upload-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Validacao
          path: |
            dist/validation-portable.json
            dist/validation-installer.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Enviar executavel portatil
        uses: actions/upload-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Windows-Portable
          path: dist/AstronyxMiniForgeStudio.exe
          if-no-files-found: error
      - name: Enviar instalador
        uses: actions/upload-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Windows-Setup
          path: dist/installer/AstronyxMiniForgeStudio-Setup-v2.0.2.exe
          if-no-files-found: error

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          actual="$(python -c 'from core.version import APP_VERSION; print(APP_VERSION)')"
          echo "version=${actual}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${actual}" ]]; then exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Windows-Setup
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Windows-Portable
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: AstronyxMiniForgeStudio-Validacao
          path: release
      - name: Conferir hash do instalador
        shell: bash
        run: |
          test -s "release/AstronyxMiniForgeStudio-Setup-v${{ steps.version.outputs.version }}.exe"
          (cd release && sed -E 's|dist/installer/|./|; s|dist/|./|' SHA256SUMS.txt | sha256sum -c -)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/AstronyxMiniForgeStudio-Setup-v${{ steps.version.outputs.version }}.exe
            release/AstronyxMiniForgeStudio.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
